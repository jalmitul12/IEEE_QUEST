<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><title>Nearby Shelters · Aegis</title><link href="/css/main.css" rel="stylesheet"/></head><body><div id="page-content"><section class="card"><div class="filter-row"><button class="btn btn-primary" id="shelter-location" type="button">Use my location</button><div class="field"><label for="shelter-status">Status</label><select class="input" id="shelter-status"><option>All</option><option>Open</option><option>Limited</option></select></div><label class="field"><span>Facilities</span><span><input id="medical-only" type="checkbox"/> Medical support only</span></label></div><div class="manual-location" style="margin-top:12px"><input aria-label="Manual latitude" class="input" id="shelter-lat" inputmode="decimal" placeholder="Manual latitude"/><input aria-label="Manual longitude" class="input" id="shelter-lon" inputmode="decimal" placeholder="Manual longitude"/><button class="btn btn-ghost" id="shelter-manual" type="button">Sort from manual location</button></div><p class="tiny muted" id="shelter-note">Set a location to sort shelters by distance.</p></section><div class="grid grid-3" id="shelter-list" style="margin-top:18px"></div></div><script src="/js/common.js"></script><script src="/js/app.js"></script><script src="/js/pages/shelters.js"></script></body></html>
