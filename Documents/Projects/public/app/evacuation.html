<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><title>Evacuation Planner · Aegis</title><link href="/vendor/leaflet/leaflet.css" rel="stylesheet"/><link href="/css/main.css" rel="stylesheet"/></head><body><div id="page-content"><div class="split"><form class="card" id="evac-form"><h2 style="font-size:20px">Build evacuation recommendation</h2><div class="field"><label for="evac-area">Current area</label><input class="input" id="evac-area" name="area" required="" value="Ahmedabad"/></div><div class="manual-location" style="margin-top:10px"><input aria-label="Evacuation latitude" class="input" id="evac-lat" inputmode="decimal" placeholder="Latitude"/><input aria-label="Evacuation longitude" class="input" id="evac-lon" inputmode="decimal" placeholder="Longitude"/><button class="btn btn-ghost" id="evac-use-location" type="button">Use my location</button></div><div class="field" style="margin-top:12px"><label for="field-hazard">Hazard</label><select class="input" id="field-hazard" name="hazard"><option>Flood</option><option>Cyclone</option><option>Fire</option><option>Earthquake</option><option>Landslide</option></select></div><div class="field" style="margin-top:12px"><label for="evac-destination">Destination</label><select class="input" id="evac-destination" name="destination"><option value="auto">Automatically choose nearest suitable shelter</option></select></div><div class="field" style="margin-top:12px"><label for="field-mobility">Mobility needs</label><select class="input" id="field-mobility" name="mobility"><option>Standard</option><option>Medical assistance</option><option>Wheelchair accessible</option></select></div><button class="btn btn-primary" style="margin-top:16px" type="submit">Generate plan</button></form><section class="card" id="evac-plan"><h2 style="font-size:20px">Evacuation plan</h2><p class="muted">Provide your current coordinates or use geolocation, then generate a simulated rout
