<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><title>Incident Management · Aegis</title><link href="/css/main.css" rel="stylesheet"/></head><body><div id="page-content"><section class="card" id="incident-create-panel"><form class="form-grid" id="incident-form"><div class="field"><label for="field-title">Incident title</label><input class="input" id="field-title" maxlength="100" name="title" placeholder="Incident title" required=""/></div><div class="field"><label for="field-type">Type</label><select class="input" id="field-type" name="type"><option>Flood</option><option>Cyclone</option><option>Earthquake</option><option>Landslide</option><option>Heatwave</option><option>Storm</option><option>Fire</option><option>Other</option></select></div><div class="field"><label for="field-severity">Severity</label><select class="input" id="field-severity" name="severity"><option>Low</option><option>Moderate</option><option>High</option><option>Severe</option><option>Critical</option></select></div><div class="field"><label for="field-location">Location</label><input class="input" id="field-location" maxlength="120" name="location" placeholder="Affected zone" required=""/></div><button class="btn btn-primary" type="submit">Report incident</button></form><p class="role-note" id="incident-role-note"></p></section><div class="notice" style="margin:14px 0">Authorized operators can drag cards through <b>Reported → Verified → Team Assigned → Responding → Resolved</b>. Team assignment is persisted to JSON.</div><div class="kanban"><section class="lane" data-status="Reported"><h3>Reported</h3></section><section class="lane" data-status="Verified"><h3>Verified</h3></section><section class="lane" data-status="Team Assigned"><h3>Team Assigned</h3></section><section class="lane" data-status="Responding"><h3>Responding</h3></section><section class="lane" data-status="Resolved"><h3>Resolved</h3></section></div></div><script src="/js/common.js"></script><script src="/js/app.js"></script><script src="/js/pages/incidents.js"></script></body></html>
