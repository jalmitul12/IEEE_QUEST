<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><title>Risk Analysis · Aegis</title><link href="/css/main.css" rel="stylesheet"/></head><body><div id="page-content"><div class="split"><form class="card" id="risk-form"><h2 style="font-size:20px">Pre-disaster risk inputs</h2><div class="form-grid"><div class="field"><label for="field-temperature">Temperature (°C)</label><input class="input" id="field-temperature" max="70" min="-20" name="temperature" required="" step="0.1" type="number" value="36"/></div><div class="field"><label for="field-rainfall">Rainfall (mm)</label><input class="input" id="field-rainfall" max="500" min="0" name="rainfall" required="" step="0.1" type="number" value="120"/></div><div class="field"><label for="field-windSpeed">Wind speed (km/h)</label><input class="input" id="field-windSpeed" max="350" min="0" name="windSpeed" required="" step="0.1" type="number" value="45"/></div><div class="field"><label for="field-humidity">Humidity (%)</label><input class="input" id="field-humidity" max="100" min="0" name="humidity" required="" step="0.1" type="number" value="78"/></div><div class="field"><label for="field-seismicActivity">Seismic activity (0–10)</label><input class="input" id="field-seismicActivity" max="10" min="0" name="seismicActivity" required="" step="0.1" type="number" value="1.2"/></div><div class="field"><label for="field-waterLevel">Water level (m)</label><input class="input" id="field-waterLevel" max="20" min="0" name="waterLevel" required="" step="0.1" type="number" value="3.5"/></div><div class="field"><label for="field-terrainRisk">Terrain risk (0–10)</label><input class="input" id="field-terrainRisk" max="10" min="0" name="terrainRisk" required="" step="0.1" type="number" value="4"/></div><div class="field"><label for="field-historicalFrequency">Historical incident frequency (0–10)</label><input class="input" id="field-historicalFrequency" max="10" min="0" name="historicalFrequency" required="" step="0.1" type="number" value="5"/></div></div><button class="btn btn-primary" style="margin-top:16px" type="submit">Analyze simulated risk</button></form><section class="card" id="risk-result"><h2 style="font-size:20px">Analysis result</h2><p class="muted">Submit validated environmental values to generate an educational risk estimate.</p></section></div><div class="notice notice-warning" style="margin-top:16px"><b>Academic model:</b> Results are simulated and are not official disaster warnings.</div></div><script src="/js/common.js"></script><script src="/js/app.js"></script><script src="/js/pages/risk.js"></script></body></html>
