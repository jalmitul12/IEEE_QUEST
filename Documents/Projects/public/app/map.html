<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Live Hazard Map · Aegis</title><link rel="stylesheet" href="/vendor/leaflet/leaflet.css"><link rel="stylesheet" href="/css/main.css"></head><body><div id="page-content"><section class="card"><div class="filter-row"><div class="field"><label for="hazard-filter">Hazard</label><select id="hazard-filter" class="input"><option value="All">All hazards</option></select></div><div class="field"><label for="severity-filter">Severity</label><select id="severity-filter" class="input"><option>All</option><option>Low</option><option>Moderate</option><option>High</option><option>Severe</option><option>Critical</option></select></div><div class="field"><label for="resource-filter">Resource type</label><select id="resource-filter" class="input"><option value="All">All markers</option><option value="Disaster">Disasters only</option><option value="Shelter">Shelters</option><option value="Hospital">Hospitals</option><option value="Police">Police</option><option value="Fire Station">Fire stations</option><option value="Assembly Point">Assembly points</option></select></div><div class="field"><label for="distance-filter">Distance from you</label><select id="distance-filter" class="input"><option value="0">Any distance</option><option value="25">Within 25 km</option><option value="50">Within 50 km</option><option value="100">Within 100 km</option></select></div><button id="use-location" class="btn btn-primary" type="button">Use my location</button></div><div class="manual-location" style="margin-top:12px"><input id="manual-lat" class="input" inputmode="decimal" placeholder="Manual latitude (e.g. 23.0225)" aria-label="Manual latitude"><input id="manual-lon" class="input" inputmode="decimal" placeholder="Manual longitude (e.g. 72.5714)" aria-label="Manual longitude"><button id="apply-manual" class="btn btn-ghost" type="button">Apply manual location</button></div><p id="map-status" class="tiny muted" aria-live="polite"></p></section><div class="split" style="margin-top:16px"><section class="map-shell"><div id="map"><div class="map-loading">Loading map and emergency markers…</div></div></section><aside class="card"><h2 style="font-size:18px">Visible markers</h2><div id="map-list" class="mobile-card-list"></div></aside></div></div><script src="/js/common.js"></script><script src="/js/app.js"></script><script src="/vendor/leaflet/leaflet.js"></script><script src="/js/pages/map.js"></script></body></html>
