<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><title>Settings · Aegis</title><link href="/css/main.css" rel="stylesheet"/></head><body><div id="page-content"><form class="card" id="settings-form"><h2 style="font-size:20px">Command-center preferences</h2><div class="form-grid"><div class="field"><label for="field-theme">Appearance</label><select class="input" id="field-theme" name="theme"><option value="dark">Dark</option><option value="light">Light</option><option value="system">Follow system</option></select></div><div class="field"><label for="field-alertSeverity">Minimum alert severity</label><select class="input" id="field-alertSeverity" name="alertSeverity"><option>Safe</option><option>Low</option><option>Moderate</option><option>High</option><option>Severe</option><option>Critical</option></select></div><label class="notice"><input name="rememberLocation" type="checkbox"/> Remember selected location on this device</label><label class="notice"><input name="notifications" type="checkbox"/> Show application notifications</label><label class="notice"><input name="reducedMotion" type="checkbox"/> Reduce motion</label><label class="notice"><input name="highContrast" type="checkbox"/> High-contrast interface</label><label class="notice"><input name="compactDashboard" type="checkbox"/> Compact dashboard spacing</label><label class="notice"><input name="sound" type="checkbox"/> Enable optional notification sound preference</label></div><button class="btn btn-primary" style="margin-top:16px" type="submit">Save preferences</button></form><div class="notice notice-warning" style="margin-top:16px">Passwords and authentication tokens are never stored in Local Storage. If location memory is disabled, persisted coordinates are deleted.</div></div><script src="/js/common.js"></script><script src="/js/app.js"></script><script src="/js/pages/settings.js"></script></body></html>
